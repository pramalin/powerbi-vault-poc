<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" role="img" aria-label="Vault changes the password; the sync job delivers it, locked, to the gateway" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="276" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a80"/>
    </marker>
  </defs>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">Vault changes the password; the sync job delivers it, locked, to the gateway</text>
  <g fill="none" stroke="#8a8a80" stroke-width="1.25">
    <path d="M170 84H205" marker-end="url(#arrow)"/>
    <path d="M355 84H390" marker-end="url(#arrow)"/>
    <path d="M540 84H575" marker-end="url(#arrow)"/>
    <path d="M95 120V224H222" marker-end="url(#arrow)"/>
    <path d="M650 120V224H522" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#1f1f1f">
    <rect x="20" y="48" width="150" height="72" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
    <text x="95" y="72" font-weight="600">HashiCorp Vault</text>
    <text x="95" y="92" font-size="11.5">Changes the DB</text>
    <text x="95" y="108" font-size="11.5">password on schedule</text>
    <rect x="205" y="48" width="150" height="72" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"/>
    <text x="280" y="72" font-weight="600">Sync job</text>
    <text x="280" y="92" font-size="11.5">Reads it, locks it</text>
    <text x="280" y="108" font-size="11.5">with gateway key</text>
    <rect x="390" y="48" width="150" height="72" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
    <text x="465" y="72" font-weight="600">Power BI service</text>
    <text x="465" y="92" font-size="11.5">Keeps only the</text>
    <text x="465" y="108" font-size="11.5">locked password</text>
    <rect x="575" y="48" width="150" height="72" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
    <text x="650" y="72" font-weight="600">Gateway (laptop)</text>
    <text x="650" y="92" font-size="11.5">Unlocks it, then</text>
    <text x="650" y="108" font-size="11.5">opens the database</text>
    <rect x="222" y="196" width="300" height="56" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
    <text x="372" y="220" font-weight="600">Reporting database</text>
    <text x="372" y="238" font-size="11.5">Accepts only the current password</text>
  </g>
  <g font-size="11.5" fill="#5f5f58">
    <text x="187.5" y="76" text-anchor="middle" font-weight="600">1</text>
    <text x="372.5" y="76" text-anchor="middle" font-weight="600">2</text>
    <text x="557.5" y="76" text-anchor="middle" font-weight="600">3</text>
    <text x="103" y="170">changes password</text>
    <text x="642" y="170" text-anchor="end">connects with it</text>
  </g>
</svg>
