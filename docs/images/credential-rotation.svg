<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Production credential rotation sequence</title>
  <desc id="desc">Vault rotates the database password, the synchronization job retrieves it, encrypts it for the Power BI gateway, updates the gateway data source through Power BI Service, validates the connection, triggers a refresh, and records audit results.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#40566f"/></marker>
    <style>.title{font:700 30px Arial,sans-serif;fill:#172b3a}.actor{font:700 17px Arial,sans-serif;fill:#172b3a}.step{font:15px Arial,sans-serif;fill:#253b4b}.num{font:700 14px Arial,sans-serif;fill:#fff}.life{stroke:#8294a5;stroke-width:2;stroke-dasharray:7 7}.msg{stroke:#40566f;stroke-width:3;marker-end:url(#arrow)}.ok{fill:#e9f6ec;stroke:#4e9258;stroke-width:2}.warn{fill:#fff7e8;stroke:#cf8428;stroke-width:2}</style>
  </defs>
  <rect width="1600" height="980" fill="#f7f9fb"/>
  <text x="800" y="48" text-anchor="middle" class="title">Production password-rotation and validation sequence</text>
  <g>
    <rect x="40" y="80" width="230" height="70" rx="12" fill="#fceff6" stroke="#b14f85" stroke-width="2"/><text x="155" y="122" text-anchor="middle" class="actor">HashiCorp Vault</text>
    <rect x="355" y="80" width="230" height="70" rx="12" fill="#eef5ff" stroke="#4385d1" stroke-width="2"/><text x="470" y="112" text-anchor="middle" class="actor">Sync automation</text><text x="470" y="135" text-anchor="middle" class="step">AWS private subnet</text>
    <rect x="670" y="80" width="230" height="70" rx="12" fill="#f3efff" stroke="#7157b7" stroke-width="2"/><text x="785" y="112" text-anchor="middle" class="actor">Power BI Service</text><text x="785" y="135" text-anchor="middle" class="step">Microsoft SaaS</text>
    <rect x="985" y="80" width="230" height="70" rx="12" fill="#edf7ed" stroke="#4e9258" stroke-width="2"/><text x="1100" y="112" text-anchor="middle" class="actor">Gateway cluster</text><text x="1100" y="135" text-anchor="middle" class="step">Windows EC2</text>
    <rect x="1300" y="80" width="230" height="70" rx="12" fill="#fff7e8" stroke="#cf8428" stroke-width="2"/><text x="1415" y="112" text-anchor="middle" class="actor">Reporting DB</text><text x="1415" y="135" text-anchor="middle" class="step">AWS private subnet</text>
  </g>
  <path d="M155 150 V910 M470 150 V910 M785 150 V910 M1100 150 V910 M1415 150 V910" class="life"/>

  <circle cx="155" cy="215" r="17" fill="#b14f85"/><text x="155" y="220" text-anchor="middle" class="num">1</text>
  <line x1="172" y1="215" x2="1398" y2="215" class="msg"/><text x="785" y="202" text-anchor="middle" class="step">Rotate dedicated reporting account password</text>

  <circle cx="470" cy="305" r="17" fill="#4385d1"/><text x="470" y="310" text-anchor="middle" class="num">2</text>
  <line x1="453" y1="305" x2="172" y2="305" class="msg"/><text x="313" y="292" text-anchor="middle" class="step">Authenticate using workload identity; read static role</text>
  <line x1="172" y1="345" x2="453" y2="345" class="msg"/><text x="313" y="332" text-anchor="middle" class="step">Current username + password over TLS</text>

  <circle cx="470" cy="430" r="17" fill="#4385d1"/><text x="470" y="435" text-anchor="middle" class="num">3</text>
  <line x1="487" y1="430" x2="768" y2="430" class="msg"/><text x="627" y="417" text-anchor="middle" class="step">Get gateway public key; encrypt credential locally</text>
  <line x1="487" y1="475" x2="768" y2="475" class="msg"/><text x="627" y="462" text-anchor="middle" class="step">PATCH gateway data-source credential</text>

  <circle cx="785" cy="560" r="17" fill="#7157b7"/><text x="785" y="565" text-anchor="middle" class="num">4</text>
  <line x1="802" y1="560" x2="1083" y2="560" class="msg"/><text x="942" y="547" text-anchor="middle" class="step">Encrypted credential available to gateway</text>
  <line x1="1117" y1="610" x2="1398" y2="610" class="msg"/><text x="1257" y="597" text-anchor="middle" class="step">Test read-only database connection</text>
  <line x1="1398" y1="650" x2="1117" y2="650" class="msg"/><text x="1257" y="637" text-anchor="middle" class="step">Connection success</text>

  <circle cx="470" cy="735" r="17" fill="#4385d1"/><text x="470" y="740" text-anchor="middle" class="num">5</text>
  <line x1="487" y1="735" x2="768" y2="735" class="msg"/><text x="627" y="722" text-anchor="middle" class="step">Trigger or observe semantic-model refresh</text>
  <line x1="802" y1="775" x2="1083" y2="775" class="msg"/><text x="942" y="762" text-anchor="middle" class="step">Refresh / DirectQuery</text>
  <line x1="1117" y1="815" x2="1398" y2="815" class="msg"/><text x="1257" y="802" text-anchor="middle" class="step">Reporting query</text>

  <rect x="355" y="860" width="545" height="70" rx="12" class="ok"/>
  <text x="627" y="890" text-anchor="middle" class="actor">6 · Record success without secret values</text>
  <text x="627" y="915" text-anchor="middle" class="step">Vault audit + automation log + Power BI refresh history</text>
  <rect x="985" y="860" width="545" height="70" rx="12" class="warn"/>
  <text x="1257" y="890" text-anchor="middle" class="actor">On failure: stop, alert and retry safely</text>
  <text x="1257" y="915" text-anchor="middle" class="step">Do not log passwords or repeatedly rotate</text>
</svg>

